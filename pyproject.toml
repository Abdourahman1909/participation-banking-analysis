[project]
name = "participation-banking-analysis"
version = "0.1.0"
description = "TEKNOFEST 2026 Scenario 2: Participation Banking Product Analysis System"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "scrapling[fetchers]>=0.4.9",
    "streamlit>=1.58.0",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_analysis"]
